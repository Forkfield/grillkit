worker_processes 1;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    sendfile on;
    keepalive_timeout 65;

    # Backend service name from docker-compose.
    upstream grillkit_backend {
        server backend:8000;
    }

    server {
        listen 80;
        server_name _;

        # Compress static assets.
        gzip on;
        gzip_types text/css application/javascript application/json;

        # --- SPA shell: served by the frontend container itself. ---
        # The user reaches the frontend; the shell owns the root path.
        location = / {
            root /usr/share/nginx/html;
            try_files /index.html =404;
        }

        # SPA static assets (served directly by the frontend).
        location ~ ^/(styles\.css|app\.js)$ {
            root /usr/share/nginx/html;
            try_files $uri =404;
        }

        # Interview/coding modules loaded dynamically by the SPA.
        location /static/ {
            root /usr/share/nginx/html;
            try_files $uri =404;
        }

        # --- Everything else is proxied to the backend. ---
        # Includes:
        #   * /api/*             - JSON endpoints consumed by the SPA
        #   * /ws, /interview/*/ws  - WebSocket endpoints
        #   * /speech/*          - speech model / question-voice endpoints
        #   * /interview/*/question-audio - media (WAV audio)
        location / {
            proxy_pass http://grillkit_backend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # WebSocket support (harmless for plain requests).
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
        }
    }
}
